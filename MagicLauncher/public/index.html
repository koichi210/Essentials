<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicLauncher</title>
<link rel="stylesheet" href="launcher.css">
<!-- three.js は Light 版では読み込まないので、launcher.js が必要なときだけ順に読み込む -->
<script src="launcher.js" defer></script>
</head>
<body>
<header id="ml-top">
  <div class="ml-row">
    <div class="ml-title" id="ml-title">MagicLauncher</div>
    <div class="ml-search">
      <span class="ml-search-icon" aria-hidden="true">🔍</span>
      <input id="ml-q" type="text" autocomplete="off" spellcheck="false" placeholder="キーを打つと検索（名前・パス・タグ・メモ）" aria-label="検索">
      <span class="ml-count" id="ml-count"></span>
      <button type="button" class="ml-clear" id="ml-clear" aria-label="絞り込みを解除" title="絞り込みを解除（Esc）">×</button>
      <div class="ml-drop" id="ml-drop" role="listbox"></div>
    </div>
    <div class="ml-buttons">
      <button type="button" class="ml-btn primary" id="ml-add">＋ 追加</button>
      <button type="button" class="ml-btn" id="ml-home">⟲ 全体表示</button>
      <button type="button" class="ml-btn" id="ml-list-btn">☰ 一覧</button>
      <button type="button" class="ml-btn" id="ml-settings-btn">⚙ 設定</button>
      <button type="button" class="ml-lite" id="ml-lite" role="switch" aria-checked="false" title="Light 版（three.js を使わない文字の一覧）">
        <span class="ml-lite-leaf" aria-hidden="true">🍃</span><span>Light</span><span class="ml-lite-knob" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <div class="ml-legend" id="ml-legend"></div>
</header>

<div id="ml-banner" class="ml-banner" role="alert" hidden></div>
<main id="ml-stage"></main>
<section id="ml-listview" class="ml-listview" hidden></section>
<aside id="ml-listpanel" class="ml-listpanel" aria-label="一覧"></aside>
<div class="ml-hint" id="ml-hint">クリック：開く（大きい円の中の空きは拡大・外は全体表示）／ 右クリック：円は編集・何もない所は追加 ／ 円・タグ・魔法陣の中心をドラッグ：入れ替え ／ ドラッグ：傾ける・右ドラッグ：移動・ホイール：ズーム</div>
<div id="ml-toasts" class="ml-toasts" aria-live="polite"></div>

<div class="ml-modal" id="ml-item-dlg" hidden>
  <form class="ml-dialog" id="ml-item-form" autocomplete="off">
    <h2 id="ml-item-title">登録</h2>
    <label class="ml-field"><span>パス / URL</span>
      <input id="f-path" type="text" spellcheck="false" placeholder="C:\Users\…\フォルダ ／ https://… ／ vscode://…">
    </label>
    <div class="ml-warn" id="f-warn" hidden></div>
    <label class="ml-field"><span>名前</span>
      <input id="f-name" type="text" spellcheck="false">
    </label>
    <div class="ml-field"><span>タグ <small>（Enter か「,」で確定。先頭のタグが円の色と置き場所を決めます。クリックで先頭へ・ドラッグで並べ替え）</small></span>
      <div class="ml-tagbox" id="f-tagbox">
        <input id="f-tag" type="text" spellcheck="false" placeholder="タグを入力">
      </div>
      <div class="ml-cands" id="f-cands"></div>
    </div>
    <div class="ml-field-row">
      <label class="ml-field ml-emoji-field"><span>絵文字</span>
        <input id="f-emoji" type="text" maxlength="8" placeholder="自動">
      </label>
      <label class="ml-field ml-grow"><span>メモ</span>
        <textarea id="f-note" rows="2"></textarea>
      </label>
    </div>
    <div class="ml-dlg-buttons">
      <button type="button" class="ml-btn danger" id="f-delete">削除</button>
      <span class="ml-grow"></span>
      <button type="button" class="ml-btn" id="f-cancel">キャンセル</button>
      <button type="submit" class="ml-btn primary" id="f-save">保存</button>
    </div>
  </form>
</div>

<div class="ml-modal" id="ml-settings-dlg" hidden>
  <div class="ml-dialog ml-settings" id="ml-settings"></div>
</div>
</body>
</html>
