<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BlurPaint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar" class="bar">
    <button class="btn" id="btnOpen" title="ファイルを開く (Ctrl+O)">開く</button>
    <button class="btn" id="btnPaste" title="画像を貼り付け (Ctrl+V)">貼り付け</button>
    <span class="sep"></span>
    <button class="btn icon" id="btnUndo" title="元に戻す (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="btn icon" id="btnRedo" title="やり直し (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <span class="sep"></span>
    <button class="btn icon needs-image" id="btnZoomOut" title="縮小 (Ctrl+-)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <span id="zoomLabel" class="num">100%</span>
    <button class="btn icon needs-image" id="btnZoomIn" title="拡大 (Ctrl++)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="btn needs-image" id="btnFit" title="全体表示 (Ctrl+0)">全体</button>
    <button class="btn needs-image" id="btnActual" title="等倍 (Ctrl+1)">100%</button>
    <span class="spacer"></span>
    <span id="sizeLabel" class="sub num"></span>
    <button class="btn primary needs-image" id="btnCopy" title="PNG でコピー (Ctrl+C)">コピー</button>
    <select id="saveFormat" class="needs-image" title="保存形式">
      <option value="png">PNG</option>
      <option value="jpeg">JPEG</option>
      <option value="webp">WebP</option>
    </select>
    <button class="btn primary needs-image" id="btnSave" title="保存 (Ctrl+S)">保存</button>
  </header>

  <main id="main">
    <nav id="tools">
      <button class="tool" data-tool="select" title="選択・移動 (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
      <button class="tool" data-tool="arrow" title="矢印 (A)"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/><path d="M10 5h9v9"/></svg></button>
      <button class="tool" data-tool="rect" title="矩形 (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button class="tool" data-tool="ellipse" title="楕円 (E)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
      <button class="tool" data-tool="line" title="直線 (L)"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button>
      <button class="tool" data-tool="pen" title="フリーハンド (P)"><svg viewBox="0 0 24 24"><path d="M4 18c3-6 5-9 7-6s3 3 4 0 2-6 5-7"/></svg></button>
      <button class="tool" data-tool="text" title="テキスト (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button class="tool" data-tool="step" title="番号 (N)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M11 9l2-1v8"/></svg></button>
      <button class="tool" data-tool="highlight" title="蛍光ペン (H)"><svg viewBox="0 0 24 24"><path d="m14 4 6 6-8 8H6v-6z"/><path d="M4 21h16"/></svg></button>
      <button class="tool" data-tool="blur" title="ぼかし・モザイク (B)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/></svg></button>
      <button class="tool" data-tool="crop" title="トリミング (C)"><svg viewBox="0 0 24 24"><path d="M7 2v15h15"/><path d="M2 7h15v15"/></svg></button>
    </nav>

    <section id="workspace">
      <div id="props" class="bar">
        <span class="group" data-group="color"><span class="label">色</span><span class="swatches"></span><input type="color" id="colorPicker" title="任意の色"></span>
        <span class="group" data-group="width"><span class="label">太さ</span><input type="range" id="width" min="1" max="30" step="1"><span class="val num" id="widthVal"></span></span>
        <span class="group" data-group="size"><span class="label">サイズ</span><input type="range" id="fontSize" min="10" max="120" step="1"><span class="val num" id="fontSizeVal"></span></span>
        <span class="group" data-group="outline"><span class="label">縁取り</span><select id="outline"><option value="none">なし</option><option value="white">白</option><option value="black">黒</option></select></span>
        <span class="group" data-group="textStyle"><span class="label">文字スタイル</span><select id="textStyle"><option value="outline">縁取り</option><option value="box">背景ボックス</option><option value="plain">なし</option></select></span>
        <span class="group" data-group="shadow"><label class="check"><input type="checkbox" id="shadow"> 影</label></span>
        <span class="group" data-group="blurMode"><span class="label">方式</span><select id="blurMode"><option value="blur">ぼかし</option><option value="pixel">モザイク</option></select></span>
        <span class="group" data-group="blurLevel"><span class="label">強さ</span><input type="range" id="blurLevel" min="2" max="40" step="1"><span class="val num" id="blurLevelVal"></span></span>
        <span class="group" data-group="crop"><span class="num" id="cropSize"></span><button class="btn primary" id="btnCropRun">トリミング実行 (Enter)</button><button class="btn" id="btnCropCancel">キャンセル (Esc)</button></span>
        <span class="hint" id="hint"></span>
        <span class="spacer"></span>
        <span class="group always"><span class="label">貼り付け・ドロップ時</span><select id="pasteMode"><option value="replace">新しい画像として開く</option><option value="overlay">今の画像に重ねる</option></select></span>
      </div>

      <div id="stage">
        <div id="canvasWrap">
          <div id="canvasBox" hidden>
            <canvas id="canvas"></canvas>
            <textarea id="textInput" spellcheck="false" hidden></textarea>
          </div>
        </div>
        <div id="empty">
          <svg class="empty-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
          <div class="empty-main"><kbd>Ctrl</kbd> + <kbd>V</kbd> で画像を貼り付け</div>
          <div>またはファイルをここにドラッグ＆ドロップ / <button class="btn" id="btnOpen2">ファイルを開く</button></div>
          <div class="sub">スクリーンショットは <kbd>Win</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> → ここで <kbd>Ctrl</kbd> + <kbd>V</kbd></div>
          <div class="sub">対応形式: PNG / JPEG / WebP / BMP / GIF / ICO / SVG / AVIF</div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" hidden></div>
  <input type="file" id="fileInput" accept="image/*,.bmp,.webp,.ico,.jfif,.avif" hidden>
  <script src="app.js"></script>
</body>
</html>
